plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // LITIengine
    implementation 'de.gurkenlabs:litiengine:0.12.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

application {
    mainClass = 'App'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
